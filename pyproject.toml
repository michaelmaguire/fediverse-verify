[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fediverse-verify"
version = "0.1.0"
description = "Turns a government wallet credential into a signed rel=me proof page"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pyjwt[crypto]>=2.9",
  "itsdangerous>=2.2",
  "python-multipart>=0.0.9",
  "segno>=1.6",
  "cbor2>=5.6",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fediverse_verify = ["templates/*.html", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
