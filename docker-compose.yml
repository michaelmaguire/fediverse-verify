# Example deployment: the verifier behind your own TLS proxy.
#   VERIFIER_SESSION_SECRET=$(openssl rand -hex 32) docker compose up -d
# Real wallets: add `--profile eudi` (EU Digital Identity Wallets) and/or `--profile swiyu`
# (Swiss e-ID), and list them in VERIFIER_IDENTITY_PROVIDERS, e.g. "eudi,swiyu".
services:
  verifier:
    build:
      context: .
      args:
        # VERIFIER_GIT_COMMIT=$(git rev-parse HEAD) docker compose build
        GIT_COMMIT: ${VERIFIER_GIT_COMMIT:-unknown}
    restart: unless-stopped
    environment:
      VERIFIER_PUBLIC_URL: ${VERIFIER_PUBLIC_URL:-http://localhost:8000}
      VERIFIER_SESSION_SECRET: ${VERIFIER_SESSION_SECRET:?set VERIFIER_SESSION_SECRET}
      VERIFIER_IDENTITY_PROVIDERS: ${VERIFIER_IDENTITY_PROVIDERS:-mock}
      VERIFIER_EUDI_ENDPOINT: ${VERIFIER_EUDI_ENDPOINT:-http://eudi-verifier:8080}
      VERIFIER_SWIYU_ENDPOINT: ${VERIFIER_SWIYU_ENDPOINT:-http://swiyu-verifier:8080}
      # Comma-separated issuer DIDs whose Swiss e-IDs are accepted (from the swiyu trust registry).
      VERIFIER_SWIYU_ISSUER_DIDS: ${VERIFIER_SWIYU_ISSUER_DIDS:-}
      # Credential types to ask for. Empty = the Sandbox Beta-ID, whose proofs are test proofs.
      VERIFIER_SWIYU_VCT_VALUES: ${VERIFIER_SWIYU_VCT_VALUES:-}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - verifier-data:/data

  eudi-verifier:
    profiles: [eudi]
    image: ghcr.io/eu-digital-identity-wallet/eudi-srv-verifier-endpoint:latest
    restart: unless-stopped
    environment:
      # Must be the public HTTPS URL wallets reach the endpoint at; see the endpoint's README.
      VERIFIER_PUBLICURL: ${EUDI_PUBLIC_URL:-https://wallet-verifier.example.org}
      VERIFIER_DEFAULTHTTPRESPONSEMODE: DirectPost
      # Wallet responses (which contain the disclosed claims) are held in this component's memory.
      # Defaults keep them up to 10 days; keep them 10 minutes. Its clean-up runs every 30 minutes,
      # so a response is gone within ~40 minutes. Stated on /about: keep the two in sync.
      VERIFIER_MAXAGE: PT10M
      VERIFIER_PRESENTATIONS_CLEANUP_MAXAGE: PT10M

  # Swiss e-ID: the federal generic verifier (github.com/swiyu-admin-ch/swiyu-verifier).
  # Needs a verifier DID registered in the swiyu identifier registry and onboarding on the
  # swiyu portals: see deploy/swiyu-registration.md.
  # Its management API must stay internal; only /oid4vp/api must be reachable by wallets.
  # Required for --profile swiyu: SWIYU_VERIFIER_DID, SWIYU_DID_VERIFICATION_METHOD,
  # SWIYU_SIGNING_KEY, SWIYU_DB_PASSWORD (Compose checks variables even for inactive profiles).
  swiyu-verifier:
    profiles: [swiyu]
    image: ghcr.io/swiyu-admin-ch/swiyu-verifier:latest
    restart: unless-stopped
    depends_on: [swiyu-db]
    environment:
      EXTERNAL_URL: ${SWIYU_EXTERNAL_URL:-https://swiyu-verifier.example.org}
      VERIFIER_DID: ${SWIYU_VERIFIER_DID:-}
      DID_VERIFICATION_METHOD: ${SWIYU_DID_VERIFICATION_METHOD:-}
      SIGNING_KEY: ${SWIYU_SIGNING_KEY:-}
      OPENID_CLIENT_METADATA_FILE: file:/verifier_metadata.json
      POSTGRES_USER: swiyu
      POSTGRES_PASSWORD: ${SWIYU_DB_PASSWORD:-}
      POSTGRES_DB: swiyu_verifier
      POSTGRES_JDBC: jdbc:postgresql://swiyu-db:5432/swiyu_verifier
      # Wallet responses (the disclosed claims) are kept in its database until the request
      # expires (10 min) and the next clean-up (every 5 min): at most ~15 min. Stated on /about.
      VERIFICATION_TTL_SEC: "600"
      DATA_CLEAR_PROCESS_INTERVAL_MS: "300000"
    configs:
      - source: swiyu_metadata
        target: /verifier_metadata.json

  swiyu-db:
    profiles: [swiyu]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: swiyu
      POSTGRES_PASSWORD: ${SWIYU_DB_PASSWORD:-}
      POSTGRES_DB: swiyu_verifier
    volumes:
      - swiyu-db:/var/lib/postgresql/data

configs:
  swiyu_metadata:
    content: |
      {
        "client_id": "${SWIYU_VERIFIER_DID}",
        "client_name": "Fediverse Verify",
        "vp_formats_supported": {
          "dc+sd-jwt": {"sd-jwt_alg_values": ["ES256"], "kb-jwt_alg_values": ["ES256"]}
        }
      }

volumes:
  verifier-data:
  swiyu-db:
